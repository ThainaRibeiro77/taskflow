{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}

{% block conteudo %}
<section class="cartao estreito">
  <h1>Criar conta</h1>
  <p class="apoio">A senha deve ter pelo menos 8 caracteres.</p>

  <form method="post">
    <label for="nome">Nome</label>
    <input id="nome" name="nome" type="text" required minlength="2">

    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" required autocomplete="email">

    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" required minlength="8" autocomplete="new-password">

    <button class="botao largo" type="submit">Cadastrar</button>
  </form>

  <p class="apoio">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a>.</p>
</section>
{% endblock %}
