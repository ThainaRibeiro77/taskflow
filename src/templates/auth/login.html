{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
<section class="cartao estreito">
  <h1>Entrar</h1>
  <p class="apoio">Acesse sua conta para gerenciar suas tarefas.</p>

  <form method="post">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" required autocomplete="email">

    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" required autocomplete="current-password">

    <button class="botao largo" type="submit">Entrar</button>
  </form>

  <p class="apoio">Não tem conta? <a href="{{ url_for('auth.cadastro') }}">Cadastre-se</a>.</p>
</section>
{% endblock %}
