{% extends "base.html" %}
{% block titulo %}{{ acao }}{% endblock %}

{% block conteudo %}
<section class="cartao">
  <h1>{{ acao }}</h1>

  <form method="post">
    <label for="titulo">Título *</label>
    <input id="titulo" name="titulo" type="text" required maxlength="120"
           value="{{ tarefa['titulo'] if tarefa else '' }}">

    <label for="descricao">Descrição</label>
    <textarea id="descricao" name="descricao" rows="4" maxlength="2000">{{ tarefa['descricao'] if tarefa else '' }}</textarea>

    <div class="linha">
      <div>
        <label for="prioridade">Prioridade</label>
        <select id="prioridade" name="prioridade">
          {% for valor, rotulo in prioridades.items() %}
            <option value="{{ valor }}"
              {% if tarefa and tarefa['prioridade'] == valor %}selected{% endif %}>
              {{ rotulo }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label for="prazo">Prazo</label>
        <input id="prazo" name="prazo" type="date"
               value="{{ tarefa['prazo'] if tarefa and tarefa['prazo'] else '' }}">
      </div>
    </div>

    <div class="acoes-form">
      <button class="botao" type="submit">Salvar</button>
      <a class="mini" href="{{ url_for('tarefas.quadro') }}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
