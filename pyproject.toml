[project]
name = "taskflow"
version = "1.0.0"
description = "Sistema web de gerenciamento de tarefas com quadro Kanban (projeto de Engenharia de Software)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
omit = ["src/templates/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
